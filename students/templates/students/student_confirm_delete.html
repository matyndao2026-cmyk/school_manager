{% extends "base.html" %}

{% block title %}Supprimer {{ student }}{% endblock %}

{% block content %}

    <h1>Supprimer {{ student }} ?</h1>

    <p>Cette action est définitive : la fiche sera effacée de la base de données.</p>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="btn-danger">
            Oui, supprimer
        </button>

        <a href="{% url 'students:student_detail' student.id %}">
            Annuler
        </a>
    </form>

{% endblock %}
